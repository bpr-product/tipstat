# Your submission is started with `docker compose up --build`.
# Rules: service name "memory" on port 8000; everything runs offline (no internet,
# only the LLM proxy and the mock world are reachable); limits 4 CPU / 6 GB RAM, no GPU.
# Do not edit this file. Put extra services (Qdrant, Postgres...) - and any depends_on or extra
# environment for "memory" - in compose.extra.yml, which the evaluation adds with -f. Examples below.
services:
  memory:
    build: .
    ports: ["${PORT:-8000}:8000"]   # keep this exact line: the eval sets PORT per submission
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL=${MODEL:-deepseek/deepseek-v4.1-flash}
